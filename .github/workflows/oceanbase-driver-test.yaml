name: OceanBase driver integration
on:
  push:
    branches: [test/oceanbase-driver-20261008]
permissions:
  contents: read
  actions: write
concurrency:
  group: oceanbase-driver-test
  cancel-in-progress: true
jobs:
  oceanbase:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Cancel superseded test attempts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST repos/haipengzzz/query-exporter/actions/runs/37752900253/cancel || true
          gh api -X POST repos/haipengzzz/query-exporter/actions/runs/37752957443/cancel || true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and record resolver conflict
        run: |
          mkdir -p results
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config default-libmysqlclient-dev
          python -m pip install . 'SQLAlchemy==2.0.43' pymysql mysqlclient 'sqlalchemy-utils>=0.38.3,<0.39'
          if python -m pip install . oceanbase-py==0.0.1.2 > results/resolver.log 2>&1; then
            echo "normal resolution succeeded" | tee results/resolution-status.txt
          else
            echo "normal resolution failed; diagnostic installation will use --no-deps" | tee results/resolution-status.txt
          fi
          python -m pip install --no-deps oceanbase-py==0.0.1.2
          python -m pip freeze > results/environment.txt
      - name: Start OceanBase CE
        run: |
          docker run -d --name ob-driver-test -p 127.0.0.1:2881:2881 \
            -e MODE=MINI -e OB_MEMORY_LIMIT=6G -e OB_DATAFILE_SIZE=2G \
            -e OB_LOG_DISK_SIZE=12G -e OB_TENANT_MEMORY_SIZE=2G \
            oceanbase/oceanbase-ce:latest
          docker inspect ob-driver-test > results/container.json
      - name: Wait for real SQL connection
        run: |
          python - <<'PY'
          import time, pymysql, json, subprocess
          from pathlib import Path
          last = None
          for attempt in range(96):
              state=subprocess.run(['docker','inspect','--format','{{.State.Running}}','ob-driver-test'],capture_output=True,text=True)
              if state.stdout.strip()!='true':
                  subprocess.run(['docker','logs','ob-driver-test'])
                  raise RuntimeError('OceanBase container exited during bootstrap')
              if attempt and attempt % 12 == 0:
                  subprocess.run(['docker','logs','--tail','20','ob-driver-test'])
              try:
                  c=pymysql.connect(host="127.0.0.1",port=2881,user="root@test",password="",connect_timeout=3,read_timeout=10,autocommit=True)
                  with c.cursor() as x:
                      x.execute("SELECT VERSION()")
                      version=x.fetchone()[0]
                      print("LIVE OCEANBASE VERSION:",version,flush=True)
                      x.execute("CREATE DATABASE IF NOT EXISTS driver_test")
                      x.execute("CREATE TABLE IF NOT EXISTS driver_test.probe (label VARCHAR(32) PRIMARY KEY, value DOUBLE)")
                      x.execute("REPLACE INTO driver_test.probe VALUES ('foo',1),('bar',2),('baz',5)")
                      x.execute("SELECT label,value FROM driver_test.probe ORDER BY label")
                      rows=x.fetchall()
                  c.close()
                  Path("results/live-database.json").write_text(json.dumps({"version":version,"rows":rows},indent=2))
                  break
              except Exception as e:
                  last=e
                  if attempt % 6 == 0: print("waiting:",repr(e),flush=True)
                  time.sleep(5)
          else:
              raise RuntimeError("OceanBase tenant not ready: "+repr(last))
          PY
      - name: Test published SQLAlchemy driver and exporter
        run: |
          python - <<'PY'
          import json,traceback,subprocess,time,urllib.request
          from pathlib import Path
          from sqlalchemy import create_engine,text
          from sqlalchemy.engine import URL
          results=[]
          for scheme in ["oceanbase","oceanbase_py"]:
              item={"scheme":scheme}
              try:
                  e=create_engine(URL.create(scheme,username="root@test",password="",host="127.0.0.1",port=2881,database="driver_test"))
                  with e.connect() as c:
                      item["version"]=c.execute(text("SELECT VERSION()")).scalar()
                      item["rows"]=[list(r) for r in c.execute(text("SELECT label,value FROM probe ORDER BY label"))]
                  e.dispose()
                  item["ok"]=True
              except Exception:
                  item["ok"]=False
                  item["traceback"]=traceback.format_exc()
              results.append(item)
              print(json.dumps(item,indent=2),flush=True)
          Path("results/sqlalchemy.json").write_text(json.dumps(results,indent=2))
          dsn=URL.create("oceanbase",username="root@test",password="",host="127.0.0.1",port=2881,database="driver_test").render_as_string(hide_password=False)
          config={"databases":{"ob":{"dsn":dsn}},"metrics":{"native_value":{"type":"gauge","labels":["label"]}},"queries":{"probe":{"databases":["ob"],"metrics":["native_value"],"sql":"SELECT label,value AS native_value FROM probe"}}}
          import yaml
          Path("results/exporter.yaml").write_text(yaml.safe_dump(config))
          with open("results/exporter.log","w") as log:
              p=subprocess.Popen(["query-exporter","-p","9560","--config","results/exporter.yaml"],stdout=log,stderr=subprocess.STDOUT)
              try:
                  for attempt in range(30):
                      if p.poll() is not None: break
                      try:
                          metrics=urllib.request.urlopen("http://127.0.0.1:9560/metrics",timeout=5).read().decode()
                          Path("results/metrics.txt").write_text(metrics)
                          expected=['native_value{database="ob",label="foo"} 1.0','native_value{database="ob",label="bar"} 2.0','native_value{database="ob",label="baz"} 5.0']
                          if all(v in metrics for v in expected):
                              print("METRICS VERIFIED",flush=True)
                              Path("results/metrics-status.txt").write_text("PASS")
                              break
                      except Exception: pass
                      time.sleep(2)
                  else: Path("results/metrics-status.txt").write_text("FAIL")
              finally:
                  p.terminate()
                  try:p.wait(timeout=10)
                  except subprocess.TimeoutExpired:p.kill();p.wait()
          if not Path("results/metrics-status.txt").exists():Path("results/metrics-status.txt").write_text("FAIL: exporter exited")
          if not all(r["ok"] for r in results) or Path("results/metrics-status.txt").read_text()!="PASS":
              raise SystemExit("Driver/exporter integration failed; see artifacts")
          PY
      - name: Collect logs
        if: always()
        run: |
          docker logs ob-driver-test > results/oceanbase-console.log 2>&1 || true
          docker cp ob-driver-test:/root/ob/log results/oceanbase-server-log 2>/dev/null || true
          docker cp ob-driver-test:/root/.obd/log results/obd-log 2>/dev/null || true
          docker inspect ob-driver-test > results/container-final.json 2>/dev/null || true
          cat results/sqlalchemy.json 2>/dev/null || true
          cat results/metrics-status.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oceanbase-driver-results
          path: results/
          retention-days: 14
      - name: Stop database
        if: always()
        run: docker rm -f ob-driver-test || true
